name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate resources
        run: python3 tools/validate.py

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      # Boots a headless server, generates terrain on every world and runs the game tests.
      # The EULA must be accepted for the test server to start.
      - name: Run game tests
        run: |
          mkdir -p build/gametest
          echo "eula=true" > build/gametest/eula.txt
          set -o pipefail
          ./gradlew runGametest --stacktrace --no-daemon 2>&1 | tee build/gametest.log

      - name: Check game log
        if: always()
        run: python3 tools/check_logs.py build/gametest.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interplanetary-stuff
          path: |
            build/libs/*.jar
            build/gametest.log
          if-no-files-found: ignore
